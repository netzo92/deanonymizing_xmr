server {
    listen 80 default_server;
    server_name _;
    root /var/www/xmr;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/((index|todos|eras|pool|conclusions)\.html|(dashboard|brain-view|research-analytics|evidence-graph|feature-audit|progress-view|live-feed|todo-results|era-view|pool-view|task-activity-view|research-guide)\.(css|js)|brain\.json|(feature-audit|research-progress|live-observations|protocol-eras|pool-observations|task-activity|hypotheses)\.json|data\.json|collector-status\.json|release\.json|ui-release\.json|pool-release\.json|pool-archive-status\.json|pool-archive-release\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    location / {
        return 404;
    }
}
